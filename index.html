/* Fintech visual refresh */
:root{--primary:#2563eb;--soft:#eff6ff;--shadow:0 10px 32px rgba(15,23,42,.06)}
[data-theme=dark]{--primary:#60a5fa;--soft:#172554;--shadow:0 10px 32px rgba(0,0,0,.28)}
body{letter-spacing:-.01em}
aside{padding:24px 16px;border-right-color:var(--border);box-shadow:4px 0 24px rgba(15,23,42,.025)}
.brand{letter-spacing:-.02em}

main{padding:32px;max-width:1540px}
.topbar{margin-bottom:26px}

.card{border-radius:18px;padding:21px;border-color:var(--border);box-shadow:var(--shadow)}
.stat-value{font-size:24px;font-weight:450;letter-spacing:-.025em}

.section-grid{gap:16px;margin-top:16px}
.transactions{margin-top:16px}

.positive{font-weight:500}.negative{font-weight:500}

.btn,.icon-btn,.theme-btn{border-radius:12px}
.field input,.field select{border-radius:12px}
.table th,.table td{padding:14px 10px}
.table th:last-child,.table td:last-child{text-align:right}

.badge{border-radius:999px;padding:5px 9px}

   Layout-only styling: existing functionality/data logic stays intact.
   ========================================================= */

:root{
  --bg:#f6f8fc;
  --card:#ffffff;
  --text:#172033;
  --muted:#687386;
  --border:#e3e8f0;
  --primary:#2563eb;
  --primary-hover:#1d4ed8;
  --soft:#eef5ff;
  --green:#059669;
  --red:#dc2626;
  --yellow:#d97706;
  --shadow:0 8px 28px rgba(15,23,42,.055);
  --shadow-hover:0 12px 34px rgba(15,23,42,.09);
}
[data-theme="dark"]{
  --bg:#090f1d;
  --card:#111827;
  --text:#f4f7fb;
  --muted:#98a3b5;
  --border:#263246;
  --primary:#60a5fa;
  --primary-hover:#93c5fd;
  --soft:#172554;
  --green:#34d399;
  --red:#f87171;
  --yellow:#fbbf24;
  --shadow:0 8px 28px rgba(0,0,0,.22);
  --shadow-hover:0 12px 34px rgba(0,0,0,.32);
}

html,body{
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  letter-spacing:-.012em;
}

/* Desktop navigation */
aside{
  width:252px;
  padding:24px 16px;
  background:color-mix(in srgb,var(--card) 97%,var(--bg));
  border-right:1px solid var(--border);
  box-shadow:4px 0 24px rgba(15,23,42,.025);
}
.brand{
  padding:7px 10px 26px;
  font-size:20px;
  letter-spacing:-.025em;
}
.brand svg{width:21px;height:21px;stroke-width:2.1}
nav button{
  min-height:44px;
  padding:11px 13px;
  margin:3px 0;
  border-radius:12px;
  font-size:13px;
  font-weight:500;
  transition:background .15s ease,color .15s ease,transform .15s ease;
}
nav button svg{width:18px;height:18px;stroke-width:1.9}
nav button:hover{transform:none}
nav button.active{
  font-weight:650;
  box-shadow:inset 3px 0 0 var(--primary);
}

/* Main content */
main{
  margin-left:252px;
  width:calc(100% - 252px);
  max-width:1580px;
  padding:34px 36px;
}
.topbar{
  margin-bottom:26px;
}
h1{
  font-size:30px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.04em;
}
.subtitle{
  font-size:13px;
  line-height:1.5;
}

/* Buttons */
.btn,.icon-btn,.theme-btn{
  border-radius:11px;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
}
.btn{
  min-height:40px;
  padding:9px 14px;
  font-size:13px;
  font-weight:600;
}
.btn.primary{
  box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 20%,transparent);
}
.btn.primary:hover{
  background:var(--primary-hover);
  border-color:var(--primary-hover);
  transform:translateY(-1px);
}
.icon-btn{
  min-width:36px;
  min-height:36px;
}
.icon-btn:hover{
  background:var(--soft);
  border-color:color-mix(in srgb,var(--primary) 28%,var(--border));
}

/* Summary cards */
.cards{
  gap:14px;
}
.cards>.card{
  min-width:0;
}
.card{
  padding:20px;
  border-radius:18px;
  border-color:var(--border);
  box-shadow:var(--shadow);
  transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease;
}
.card:hover{
  border-color:color-mix(in srgb,var(--primary) 12%,var(--border));
}
.stat-label{
  font-size:12px;
  font-weight:550;
  letter-spacing:0;
}
.stat-value{
  margin-top:8px;
  font-size:25px;
  line-height:1.15;
  font-weight:500;
  letter-spacing:-.03em;
}

/* Section hierarchy */
.section-grid{
  gap:16px;
  margin-top:16px;
}
.section-title{
  margin-bottom:14px;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.018em;
}
.small{
  line-height:1.45;
}

/* Accounts */
.account{
  padding:12px;
  border-radius:13px;
  background:color-mix(in srgb,var(--card) 97%,var(--soft));
}
.account:hover{
  border-color:color-mix(in srgb,var(--primary) 20%,var(--border));
}
.account-icon{
  width:38px;
  height:38px;
  border-radius:11px;
}
.amount{
  font-weight:500;
  letter-spacing:-.02em;
}

/* Forms */
.form-grid{gap:14px}
.field label{
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
  text-transform:none;
}
.field input,.field select{
  min-height:42px;
  padding:10px 12px;
  border-radius:11px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field input:focus,.field select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent);
}
.form-actions{margin-top:16px}

/* Tables */
.table-wrap{
  width:100%;
  max-width:100%;
}
.table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
}
.table th,.table td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.table th{
  font-size:11px;
  font-weight:650;
  letter-spacing:.01em;
  color:var(--muted);
}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{
  background:color-mix(in srgb,var(--soft) 45%,transparent);
}
.badge{
  padding:4px 8px;
  font-size:10px;
  font-weight:600;
}

/* Dashboard recent activity + category panel */
.recent-overview-grid{
  gap:22px;
}
.category-overview{
  padding-left:20px;
}
.category-overview-title{
  font-size:13px;
  margin-bottom:13px;
}
.category-item{
  margin-bottom:12px;
}
.category-item-top{
  font-size:12px;
}
.category-bar{
  height:6px;
}

/* Quick actions */
.quick-grid{gap:11px}
.quick-btn{
  min-height:108px;
  border-radius:15px;
  padding:14px 11px;
  box-shadow:none;
}
.quick-btn strong{
  font-size:13px;
  font-weight:650;
}
.quick-btn .small{font-size:10px}

/* DealPlug card */
.dealplug-dashboard-card{
  overflow:hidden;
}
.dealplug-dashboard-card .stat-value{
  font-size:24px;
}

/* Monthly account snapshots */
.account-snapshots-card{
  max-width:920px;
}
.snapshot-month{
  border-radius:13px;
  padding:11px 13px;
}
.snapshot-input-wrap{
  width:115px;
  min-height:36px;
  border-radius:9px;
}
.snapshot-input-wrap input{
  font-size:13px;
}

/* Backup / theme controls */
.bottom-tools{
  left:16px;
  right:16px;
  bottom:18px;
}
.theme-btn{
  min-height:40px;
  padding:9px 11px;
  font-size:12px;
  font-weight:550;
}
.theme-btn:hover{
  background:var(--soft);
}

/* Mobile app */
@media(max-width:700px){
  aside{display:none}
  main{
    margin:0;
    width:100%;
    max-width:none;
    padding:17px 14px calc(96px + env(safe-area-inset-bottom));
  }
  .mobile-head{
    margin-bottom:18px;
  }
  .mobile-head .brand{
    padding:0;
    font-size:18px;
  }
  .mobile-head .brand svg{
    width:19px;
    height:19px;
  }
  .topbar{
    margin-bottom:18px;
  }
  .topbar h1{
    font-size:24px;
  }
  .cards{
    gap:9px;
  }
  .card{
    padding:15px;
    border-radius:16px;
  }
  .stat-label{font-size:11px}
  .stat-value{font-size:19px}
  .section-grid{
    gap:12px;
    margin-top:12px;
  }
  .section-title{font-size:14px}
  .account{padding:10px}
  .account-icon{
    width:34px;
    height:34px;
    border-radius:10px;
  }
  .recent-overview-grid{
    gap:0;
  }
  .category-overview{
    margin-top:8px;
    padding-top:15px;
  }

  /* Recent transactions: compact, no horizontal overflow */
  #dashboard .recent-overview-grid .table{
    table-layout:fixed;
    min-width:0;
    width:100%;
  }
  #dashboard .recent-overview-grid .table th,
  #dashboard .recent-overview-grid .table td{
    padding:9px 3px;
    font-size:10.5px;
  }
  #dashboard .recent-overview-grid .table th:nth-child(1),
  #dashboard .recent-overview-grid .table td:nth-child(1){width:33%}
  #dashboard .recent-overview-grid .table th:nth-child(2),
  #dashboard .recent-overview-grid .table td:nth-child(2){width:27%}
  #dashboard .recent-overview-grid .table th:nth-child(3),
  #dashboard .recent-overview-grid .table td:nth-child(3){width:21%;white-space:nowrap}
  #dashboard .recent-overview-grid .table th:nth-child(4),
  #dashboard .recent-overview-grid .table td:nth-child(4){width:19%;white-space:nowrap;text-align:right}
  #dashboard .recent-overview-grid .table td:first-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #dashboard .recent-overview-grid .badge{
    display:inline-flex;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding:3px 5px;
    font-size:8.5px;
  }

  .bottom-nav{
    box-shadow:0 -8px 28px rgba(15,23,42,.08);
    background:color-mix(in srgb,var(--card) 94%,transparent);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-top-color:var(--border);
  }
  .bottom-nav button{
    min-height:44px;
    border-radius:10px;
    font-weight:500;
  }
  .bottom-nav button.active{
    background:var(--soft);
    font-weight:650;
  }
  .bottom-nav button svg{
    width:19px;
    height:19px;
  }
}

/* Very small iPhones */
@media(max-width:390px){
  main{
    padding-left:12px;
    padding-right:12px;
  }
  .card{padding:14px}
  .stat-value{font-size:18px}
  #dashboard .recent-overview-grid .table th,
  #dashboard .recent-overview-grid .table td{
    padding-left:2px;
    padding-right:2px;
    font-size:10px;
  }
}

/* Reduce accidental horizontal page overflow */
html,body,#root,.app{
  max-width:100%;
  overflow-x:hidden;
}

/* Dashboard kleurcorrectie: bovenste 4 tegels neutraal, DealPlugNL neutraal */

 }

<script>
"use strict";

const STORAGE_KEY="budgetPlannerV2";
const DEFAULT_ACCOUNTS=[
{id:"acc1",name:"ABN Betaalrekening",type:"betaal",balance:0,icon:"wallet"},
{id:"acc2",name:"ABN Amro",type:"spaar",balance:0,icon:"piggy-bank"},
{id:"acc3",name:"Revolut Betaalrekening",type:"revolut-betaal",balance:0,icon:"credit-card"},
{id:"acc4",name:"Revolut",type:"revolut-spaar",balance:0,icon:"landmark"}
];
const categories=["Wonen","Boodschappen","Auto","Benzine","Vervoer","Abonnementen","Uit eten","Entertainment","Kleding","Vakantie","Gezondheid","Sport","Verzekeringen","Belastingen","Salaris","Freelance","Sparen","Overig"];
const quickExpenses=[["Boodschappen","shopping-cart"],["Tanken","fuel"],["Uit eten","utensils"],["Abonnement","credit-card"],["Kleding","shirt"],["Vervoer","car"],["Entertainment","gamepad-2"],["Vakantie","plane"],["Gezondheid","heart-pulse"],["Overig","more-horizontal"],["Crypto","bitcoin"]];

function freshData(){
return {theme:"light",cryptoEnabled:true,crypto:0,cryptoEntries:[],pokemonInitialInvestment:0,pokemonInitialInvestmentSet:false,pokemonCards:[],accounts:structuredClone(DEFAULT_ACCOUNTS),transactions:[],budgets:[],goals:[],recurring:[],weeklySalary:{enabled:false,amount:0,accountId:"",description:"Wekelijks loon"},dealplug:{opening:0,entries:[]},processedRecurring:{},accountSnapshots:{}};
}
function loadData(){
let raw=null;
try{raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")}catch(e){}
if(!raw){
  try{
    const old=JSON.parse(localStorage.getItem("budgetPlannerV1")||"null");
    if(old) raw=old;
  }catch(e){}
}
const d=raw||freshData();
d.theme=d.theme==="dark"?"dark":"light";
d.cryptoEnabled=typeof d.cryptoEnabled==="boolean"?d.cryptoEnabled:true;
d.crypto=Number(d.crypto)||0;
d.accounts=Array.isArray(d.accounts)&&d.accounts.length?d.accounts:structuredClone(DEFAULT_ACCOUNTS);
const rename={"Betaalrekening":"ABN Betaalrekening","Spaarrekening":"ABN Amro","ABN Spaarrekening":"ABN Amro","Revolut Spaarrekening":"Revolut"};
d.accounts.forEach(a=>{if(rename[a.name])a.name=rename[a.name];a.balance=Number(a.balance)||0});
const savings=d.accounts.filter(a=>a.type==="spaar"||a.type==="revolut-spaar"||/spaarrekening/i.test(a.name));
d.accounts=savings.length?savings:[structuredClone(DEFAULT_ACCOUNTS[1])];
d.transactions=Array.isArray(d.transactions)?d.transactions:[];
d.budgets=Array.isArray(d.budgets)?d.budgets:[];
d.goals=Array.isArray(d.goals)?d.goals:[];
d.recurring=Array.isArray(d.recurring)?d.recurring:[];
d.cryptoEntries=Array.isArray(d.cryptoEntries)?d.cryptoEntries:[];
  d.cryptoEntries.forEach(e=>{if(!e.assetType)e.assetType="crypto"});
  // Historische Pokémon-inleg is pas actief nadat de gebruiker deze zelf heeft opgeslagen.
  // Bestaande oude standaardwaarden (zoals €1.200) worden daardoor niet automatisch meegenomen.
  d.pokemonInitialInvestmentSet=d.pokemonInitialInvestmentSet===true;
  d.pokemonInitialInvestment=d.pokemonInitialInvestmentSet?(Number(d.pokemonInitialInvestment)||0):0;
  d.pokemonCurrentValue=Number(d.pokemonCurrentValue)||0;
  // Eenmalige migratie: het dashboard gebruikte de historische inleg als waarde van de oude
  // collectie. Dat bedrag nemen we over als huidige waarde, zodat er niets verspringt, en
  // daarna gebruiken Dashboard en Crypto/Pokemon-tab hetzelfde veld.
  if(d.pokemonCurrentValueSet!==true){
    if(d.pokemonCurrentValue===0 && d.pokemonInitialInvestment>0) d.pokemonCurrentValue=d.pokemonInitialInvestment;
    d.pokemonCurrentValueSet=true;
  }
  d.pokemonCards=Array.isArray(d.pokemonCards)?d.pokemonCards:[];
  d.pokemonCards=d.pokemonCards.map(c=>({
    id:c.id||uid(),
    name:String(c.name||""),
    set:String(c.set||""),
    cardNumber:String(c.cardNumber||""),
    condition:c.condition==="psa"?"psa":"raw",
    psaGrade:String(c.psaGrade||""),
    psaCert:String(c.psaCert||""),
    language:c.language==="japanese"?"japanese":"english",
    purchasePrice:Number(c.purchasePrice)||0,
    currentValue:Number(c.currentValue)||0,
    purchaseDate:String(c.purchaseDate||today()),
    status:c.status==="sold"?"sold":"held",
    salePrice:Number(c.salePrice)||0,
    saleDate:String(c.saleDate||"")
  }));
d.dealplug=d.dealplug&&typeof d.dealplug==="object"?d.dealplug:{opening:0,entries:[]};
d.dealplug.opening=Number(d.dealplug.opening)||0;
d.dealplug.entries=Array.isArray(d.dealplug.entries)?d.dealplug.entries:[];
d.weeklySalary=d.weeklySalary&&typeof d.weeklySalary==="object"?d.weeklySalary:{enabled:false,amount:0,accountId:d.accounts[0]?.id||"",description:"Wekelijks loon"};
d.weeklySalary.enabled=!!d.weeklySalary.enabled;
d.weeklySalary.amount=Number(d.weeklySalary.amount)||0;
d.weeklySalary.accountId=(d.accounts.some(a=>a.id===d.weeklySalary.accountId)?d.weeklySalary.accountId:d.accounts[0]?.id)||"";
d.processedRecurring=d.processedRecurring&&typeof d.processedRecurring==="object"?d.processedRecurring:{};
d.accountSnapshots=d.accountSnapshots&&typeof d.accountSnapshots==="object"?d.accountSnapshots:{};
return d;
}
let data; // wordt hieronder gevuld, nadat uid() en today() bestaan
let activeView="dashboard";
let activeAssetTab="crypto";
let amountsVisible=true;
let currentMonth=new Date();
currentMonth.setDate(1);

const $=id=>document.getElementById(id);
const euro=n=>new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const protectedEuro=n=>amountsVisible?euro(n):"••••••";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const dateKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const monthKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`};
const monthName=()=>currentMonth.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
const today=()=>{const x=new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const accountById=id=>data.accounts.find(a=>a.id===id);
const monthTransactions=()=>data.transactions.filter(t=>monthKey(t.date)===monthKey(currentMonth));
data=loadData();

let persistWarned=false;
function persist(){
try{
localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}catch(e){
  // Opslaan mislukt (opslag vol of geblokkeerd). Eén keer waarschuwen, anders blijft het scherm alerts geven.
  if(!persistWarned){
    persistWarned=true;
    alert("Let op: je gegevens konden niet worden opgeslagen in deze browser. Download direct een backup via 'Backup downloaden'.");
  }
}
}
function saveAndRender(){persist();render();}
function notify(msg){alert(msg);}

function setActiveView(view){
activeView=view;
document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===view));
document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
}
function navEvents(){
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setActiveView(b.dataset.view)));
}
function themeToggle(){data.theme=data.theme==="dark"?"light":"dark";saveAndRender();}
function setupGlobalControls(){
$("themeBtn").onclick=themeToggle;
$("mobileTheme").onclick=themeToggle;
}

function processRecurringTransactions(){
const now=new Date();
const realMonth=monthKey(now);
const day=now.getDate();
const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
let changed=false;
data.recurring.forEach(r=>{
const marker=realMonth+"_"+r.id;
if(data.processedRecurring[marker])return;
const scheduledDay=Math.min(31,Math.max(1,Number(r.day||1)));
const effectiveDay=Math.min(scheduledDay,lastDay);
if(day<effectiveDay)return;
const acc=accountById(r.accountId);
if(!acc)return;
const amount=Number(r.amount)||0;
if(amount<=0)return;
if(r.kind==="expense"&&acc.balance<amount)return;
const txDate=new Date(now.getFullYear(),now.getMonth(),effectiveDay);
const tx={id:uid(),description:r.description,amount,date:dateKey(txDate),category:r.category,accountId:r.accountId,kind:r.kind,recurringId:r.id};
data.transactions.push(tx);
acc.balance += r.kind==="income"?amount:-amount;
data.processedRecurring[marker]=true;
changed=true;
});
if(changed)persist();
}

function render(){
document.documentElement.dataset.theme=data.theme;
$("crypto").style.display="";
renderDashboard();renderTransactions();renderAccounts();renderCrypto();renderDealPlug();renderGoals();renderRecurring();
setActiveView(activeView);
lucide.createIcons();
}

function valForDashboard(type,snapshot){
  if(type==="private") return revolutPrivateBalance(snapshot);
  return 0;
}

function monthlyAccountEffect(month,ids){
  const ts=Array.isArray(data.transactions)?data.transactions:[];
  return ts.filter(t=>monthKey(t.date)===month).reduce((sum,t)=>{
    const amount=Number(t.amount||0);
    if(t.kind==="income" && ids.includes(t.accountId)) return sum+amount;
    if(t.kind==="expense" && ids.includes(t.accountId)) return sum-amount;
    if(t.kind==="transfer"){
      if(ids.includes(t.accountId)) sum-=amount;
      if(ids.includes(t.toAccountId)) sum+=amount;
    }
    return sum;
  },0);
}

function displayedAccountBalances(month){
  const key=month||monthKey(currentMonth);
  const snap=data.accountSnapshots?.[key]||{};

  // Actuele saldi zijn leidend voor het scherm. De maandstand blijft alleen
  // de historische referentie en wordt nooit aangepast door overboekingen.
  // ABN en Revolut privé hebben een echte account-balance; DealPlug/Crypto
  // worden vanuit hun maandstand + mutaties berekend.
  const abnAccount=accountById("acc2");
  const revolutAccount=accountById("acc4");
  const realCurrentMonth=monthKey(new Date());
  const isCurrentMonth=key===realCurrentMonth;

  // Voor de huidige maand gebruiken we de actuele rekeningstatus.
  // Voor historische maanden gebruiken we juist de opgeslagen maandstand.
  // Zo overschrijft een actuele rekeningstand nooit een eerder opgeslagen maandstand.
  const snaps=data.accountSnapshots||{};
  const has=(o,f)=>{if(!o)return false;if(f.includes("."))return o.revolutSubaccounts&&Object.prototype.hasOwnProperty.call(o.revolutSubaccounts,f.split(".")[1]);return Object.prototype.hasOwnProperty.call(o,f)};
  const getv=(o,f)=>Number(f.includes(".")?o.revolutSubaccounts[f.split(".")[1]]:o[f])||0;
  const nextM=m=>{let[y,mm]=m.split("-").map(Number);mm++;if(mm>12){mm=1;y++}return `${y}-${String(mm).padStart(2,"0")}`};
  const allMonths=[...Object.keys(snaps),...(data.transactions||[]).map(t=>t.month||monthKey(t.date)),...((data.dealplug?.entries)||[]).map(e=>monthKey(e.date))].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
  // Laatste maand (t/m key) met een opgeslagen stand voor dit veld; zonder stand
  // wordt het eindsaldo van eerdere maanden automatisch meegenomen.
  const carry=(field,effect)=>{
    const baseKey=Object.keys(snaps).filter(m=>m<=key&&has(snaps[m],field)).sort().pop();
    let total=baseKey?getv(snaps[baseKey],field):0;
    let m=baseKey||allMonths[0]||key, guard=0;
    while(m<=key&&guard++<600){total+=effect(m);m=nextM(m)}
    return total;
  };
  const transferFor=(m,target)=>(data.transactions||[]).filter(t=>t.kind==="revolutTransfer"&&(t.month||monthKey(t.date))===m).reduce((sum,t)=>{const n=Number(t.amount||0);if(t.fromTarget===target)sum-=n;if(t.toTarget===target)sum+=n;return sum},0);
  const histCarry=(field,ids)=>{
    if(has(snap,field))return getv(snap,field);
    const baseKey=Object.keys(snaps).filter(m=>m<key&&has(snaps[m],field)).sort().pop();
    if(!baseKey)return 0;
    let total=getv(snaps[baseKey],field),m=nextM(baseKey),g=0;
    while(m<=key&&g++<600){total+=monthlyAccountEffect(m,ids);m=nextM(m)}
    return total;
  };
  const abn=isCurrentMonth && abnAccount ? Number(abnAccount.balance||0) : histCarry("acc1",["acc1","acc2"]);
  const privateRevolut=isCurrentMonth && revolutAccount ? Number(revolutAccount.balance||0) : histCarry("acc4",["acc4"]);
  const dealplug=carry("revolutSubaccounts.dealplug",m=>transferFor(m,"dealplug")+dealplugNetForMonth(m));
  const crypto=carry("revolutSubaccounts.crypto",m=>transferFor(m,"crypto"));
  const revolut=privateRevolut+dealplug+crypto;

  return {abn,privateRevolut,dealplug,crypto,revolut,total:abn+revolut};
}

function dashboardTransactionTime(t){
  // Nieuwe transacties krijgen een uid die begint met Date.now() in base36.
  // Alleen de eerste 8 tekens horen bij de timestamp; de rest is willekeurige
  // tekst. Door niet de volledige id te parsen voorkomen we een ongeldige datum.
  const rawId=String(t?.id||"").replace(/^dp_/,'');
  const timestamp=parseInt(rawId.slice(0,8),36);
  if(Number.isFinite(timestamp) && timestamp>100000000000) return timestamp;

  // Ook oudere transacties kunnen een expliciete aanmaaktijd bevatten.
  const explicitTime=t?.createdAt||t?.timestamp||t?.created_at;
  if(explicitTime!==undefined && explicitTime!==null){
    const explicitParsed=typeof explicitTime==="number"
      ? explicitTime
      : new Date(explicitTime).getTime();
    if(Number.isFinite(explicitParsed) && explicitParsed>0) return explicitParsed;
  }

  const parsedDate=new Date(t?.date).getTime();
  return Number.isFinite(parsedDate)?parsedDate:0;
}

function dashboardTransactionDateText(t){
  const raw=t?.date;
  const parsed=new Date(raw);
  if(!Number.isNaN(parsed.getTime())){
    return parsed.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit",year:"numeric"});
  }
  return "Datum onbekend";
}

function renderDashboard(){
const ts=monthTransactions();
const incomeTransactions=ts.filter(t=>t.kind==="income").reduce((s,t)=>s+Number(t.amount),0);
const expenseTransactions=ts.filter(t=>t.kind==="expense").reduce((s,t)=>s+Number(t.amount),0);
const dealplugMonthEntries=Array.isArray(data.dealplug?.entries)
  ? data.dealplug.entries.filter(e=>monthKey(e.date)===monthKey(currentMonth))
  : [];
const dealplugMonthIncome=dealplugMonthEntries.filter(e=>e.kind==="income").reduce((s,e)=>s+Number(e.amount||0),0);
// Inkoopkosten van een verkoop staan al als gekoppelde uitgave in data.transactions
// (expenseTransactions). Ze worden hier dus NIET nog eens geteld; alleen losse
// DealPlugNL-kosten komen erbij.
const dealplugMonthCosts=dealplugMonthEntries.reduce((s,e)=>{
  if(e.dealplugSale) return s;
  if(e.kind==="expense"||e.kind==="cost"||e.kind==="kosten") return s+Number(e.amount||0);
  return s;
},0);
// DealPlugNL-verkopen en losse kosten tellen mee in de maandtotalen op het dashboard.
const income=incomeTransactions+dealplugMonthIncome;
const expenses=expenseTransactions+dealplugMonthCosts;
const dashboardSnapshotKey=monthKey(currentMonth);
const dashboardSnapshot=data.accountSnapshots?.[dashboardSnapshotKey]||{};
const hasDashboardSnapshot=Object.prototype.hasOwnProperty.call(dashboardSnapshot,"acc1")||Object.prototype.hasOwnProperty.call(dashboardSnapshot,"acc4");
const accountStand=hasDashboardSnapshot
  ? Number(dashboardSnapshot.acc1||0)+revolutTotal(dashboardSnapshot,dashboardSnapshotKey)
  : data.accounts.reduce((s,a)=>s+Number(a.balance),0);
// Beschikbaar geld = opgeslagen maandstand + inkomsten - uitgaven.
// De handmatige rekeningstand zelf blijft ongewijzigd door transacties.
const cash=accountStand+(incomeTransactions-expenseTransactions);
const net=income-expenses;
// Laat gewone transacties ook direct terugkomen in de weergegeven rekeningstand.
// Het maandelijkse snapshot blijft het uitgangspunt; de transacties van deze maand worden daarop toegepast.
const displayedBalances=displayedAccountBalances(dashboardSnapshotKey);
const dashboardAbnBalance=displayedBalances.abn;
const dashboardRevolutBalance=displayedBalances.revolut;
const dealplugEntries=Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[];
const dpIncome=dealplugEntries.filter(e=>e.kind==="income").reduce((s,e)=>s+Number(e.amount||0),0);
const dpCosts=dealplugEntries.reduce((s,e)=>{
  if(e.dealplugSale) return s+Number(e.cost||0);
  if(e.kind==="expense"||e.kind==="cost"||e.kind==="kosten") return s+Number(e.amount||0);
  return s;
},0);
// Huidige stand = zelfde berekening als de DealPlugNL-tab: inkoopkosten van verkopen
// worden van ABN Amro afgeboekt en tellen dus niet mee in de DealPlugNL-stand.
const dpCashMovement=dealplugEntries.reduce((s,e)=>s+dealplugEntryCashEffect(e),0);
const dpBalance=Number(data.dealplug.opening)+dpCashMovement;
const dashboardCryptoEntries=Array.isArray(data.cryptoEntries)?data.cryptoEntries:[];
const dashboardCryptoInvested=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="crypto"&&e.type==="in").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardCryptoCashouts=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="crypto"&&e.type==="out").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardCryptoResult=dashboardCryptoCashouts-dashboardCryptoInvested;
const dashboardCryptoOpen=Math.max(0,dashboardCryptoInvested-dashboardCryptoCashouts);
const dashboardPokemonLegacyInvested=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="pokemon"&&e.type==="in").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardPokemonLegacyCashouts=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="pokemon"&&e.type==="out").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardPokemonCardPurchaseTotal=Array.isArray(data.pokemonCards)
  ? data.pokemonCards.reduce((s,c)=>s+Number(c.purchasePrice||0),0)
  : 0;
// Dashboard: Pokémon-inleg = historische inleg + nieuwe kaart-aankopen.
// Verkoopopbrengsten van Pokémon worden apart getoond van crypto-uitcashingen.
const dashboardPokemonInvested=Number(data.pokemonInitialInvestment||0)+dashboardPokemonCardPurchaseTotal;
const dashboardPokemonSold=Array.isArray(data.pokemonCards)
  ? data.pokemonCards.filter(c=>c.status==="sold").reduce((s,c)=>s+Number(c.salePrice||0),0)
  : 0;
const dashboardPokemonCashouts=dashboardPokemonSold;
const dashboardPokemonResult=dashboardPokemonCashouts-dashboardPokemonInvested;
const dashboardPokemonOpen=Math.max(0,dashboardPokemonInvested-dashboardPokemonCashouts);
// De actuele Pokémon-waarde op het dashboard is losgekoppeld van de historische inleg.
// De eerder opgeslagen huidige waarde van de oude collectie blijft behouden; nieuwe kaarten
// worden toegevoegd op basis van hun eigen huidige waarde. Verkochte kaarten tellen niet mee.
// Dashboard: de historische Pokémon-waarde is een eenmalig startpunt.
// Nieuwe kaarten worden daar bovenop toegevoegd op basis van hun actuele waarde.
// Verkochte kaarten tellen niet meer mee in de actuele collectie.
// Zelfde bron als de Crypto/Pokemon-tab: de opgeslagen huidige waarde van de oude collectie.
const dashboardPokemonHistoricalValue=Number(data.pokemonCurrentValue||0);
const dashboardPokemonCardCurrentValue=Array.isArray(data.pokemonCards)
  ? data.pokemonCards.filter(c=>c.status!=="sold").reduce((s,c)=>s+Number(c.currentValue||0),0)
  : 0;
const dashboardPokemonValue=dashboardPokemonHistoricalValue+dashboardPokemonCardCurrentValue;
// Laatste transacties worden hieronder samengesteld uit zowel gewone rekeningtransacties
// als DealPlugNL-mutaties. Daardoor verschijnt een verkoop ook direct op het dashboard.

// Laatste transacties voor de rekeningtegel op het dashboard.
// Belangrijk: dit zijn werkelijk de laatste transacties over ALLE maanden,
// niet alleen transacties uit de huidige maand. DealPlugNL-verkopen staan
// apart opgeslagen en worden hier als dashboard-transactie toegevoegd.
const allDashboardDealplugTransactions=(Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[])
  .map(e=>({
    id:`dp_${e.id}`,
    description:e.description||"DealPlugNL",
    amount:Number(e.amount||0),
    date:e.date,
    category:e.dealplugSale?"DealPlugNL verkoop":(e.category||"DealPlugNL"),
    accountId:"acc4",
    kind:e.kind==="income"?"income":"expense",
    dashboardSource:"DealPlugNL"
  }));
const allDashboardTransactions=[...data.transactions,...allDashboardDealplugTransactions];

// We nemen maximaal de laatste 3 DealPlugNL-mutaties mee, maar sorteren daarna
// ALLE transacties samen op echte aanmaaktijd. De uid() van de app begint met
// Date.now() en bevat daardoor de exacte aanmaaktijd. Zo staat de allerlaatste
// transactie die je hebt gemaakt altijd echt bovenaan, ook als meerdere
// transacties dezelfde datum hebben.
const recentDealplugTransactions=[...allDashboardDealplugTransactions]
  .sort((a,b)=>{
    const dateDiff=new Date(b.date)-new Date(a.date);
    if(dateDiff!==0)return dateDiff;
    return String(b.id||"").localeCompare(String(a.id||""));
  })
  .slice(0,3);
const recentAccountTransactions=data.transactions
  .filter(t=>t.accountId);

// Eerst de laatste 3 DealPlugNL-mutaties + alle rekeningtransacties verzamelen,
// daarna pas gezamenlijk sorteren op datum/tijd.
const recent=[...recentDealplugTransactions,...recentAccountTransactions]
  .sort((a,b)=>{
    const timeDiff=dashboardTransactionTime(b)-dashboardTransactionTime(a);
    if(timeDiff!==0)return timeDiff;
    const dateDiff=new Date(b.date)-new Date(a.date);
    if(dateDiff!==0)return dateDiff;
    return String(b.id||"").localeCompare(String(a.id||""));
  })
  .slice(0,10);

const abnRecentTransactions=allDashboardTransactions
  .filter(t=>t.accountId==="acc1"||t.accountId==="acc2"||t.toAccountId==="acc1"||t.toAccountId==="acc2")
  .sort((a,b)=>{
    const timeDiff=dashboardTransactionTime(b)-dashboardTransactionTime(a);
    if(timeDiff!==0)return timeDiff;
    const dateDiff=new Date(b.date)-new Date(a.date);
    if(dateDiff!==0)return dateDiff;
    return String(b.id||"").localeCompare(String(a.id||""));
  })
  .slice(0,3);

const dashboardSortTime=(t)=>{
  const v=dashboardTransactionTime(t);
  return Number.isFinite(v)&&v>0?v:new Date(t.date||0).getTime();
};
const sortDashboardTransactions=(arr)=>arr.sort((a,b)=>dashboardSortTime(b)-dashboardSortTime(a));

// Per Revolut-rekening de laatste 3 transacties.
// Revolut privé = acc4 + mutaties/overboekingen naar privé.
// DealPlugNL = DealPlugNL-verkopen/kosten + Revolut-mutaties/overboekingen.
// Crypto/Aandelen = crypto-mutaties + Revolut-mutaties/overboekingen.
const revolutPrivateRecentTransactions=sortDashboardTransactions(allDashboardTransactions.filter(t=>
  ((t.accountId==="acc4"||t.toAccountId==="acc4") && t.dashboardSource!=="DealPlugNL" && t.kind!=="revolutAdjustment") ||
  (t.kind==="revolutAdjustment" && t.target==="private") ||
  (t.kind==="revolutTransfer" && (t.fromTarget==="private"||t.toTarget==="private"))
)).slice(0,3);
const dealplugRecentTransactions=sortDashboardTransactions(allDashboardTransactions.filter(t=>
  t.dashboardSource==="DealPlugNL" ||
  (t.kind==="revolutAdjustment" && t.target==="dealplug") ||
  (t.kind==="revolutTransfer" && (t.fromTarget==="dealplug"||t.toTarget==="dealplug"))
)).slice(0,3);
// Crypto / Aandelen is een aparte geldrekening binnen Revolut.
// Belangrijk: de administratie uit het tabblad Crypto/Pokemon (data.cryptoEntries)
// hoort hier NIET bij. Alleen geldmutaties van de aparte rekening zelf worden getoond.
const cryptoRecentTransactions=sortDashboardTransactions(
  allDashboardTransactions.filter(t=>
    (t.kind==="revolutAdjustment" && t.target==="crypto") ||
    (t.kind==="revolutTransfer" && (t.fromTarget==="crypto"||t.toTarget==="crypto"))
  )
).slice(0,3);
const compactAccountTransaction=(t)=>{
  const amount=Number(t.amount||0);
  const isIncome=t.kind==="income";
  const isTransfer=t.kind==="transfer"||t.kind==="revolutTransfer";
  const sign=isIncome?"+":isTransfer?"↔":"-";
  const cls=isIncome?"positive":isTransfer?"":"negative";
  const source=t.dashboardSource||({private:"Privé",dealplug:"DealPlugNL",crypto:"Crypto / Pokémon"}[t.target]||"");
  const sourceText=source?` · ${esc(source)}`:"";
  const txTime=dashboardTransactionTime(t);
  const timeText=Number.isFinite(txTime)&&txTime>0?new Date(txTime).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}):"";
  return `<div class="dashboard-account-tx-row"><div><strong>${esc(t.description||"Transactie")}</strong><span>${dashboardTransactionDateText(t)}${timeText?` · ${timeText}`:""}${sourceText}</span></div><strong class="${cls}">${sign}${protectedEuro(amount)}</strong></div>`;
};

const dashboardSnapshotLabel=new Date(Number(dashboardSnapshotKey.slice(0,4)),Number(dashboardSnapshotKey.slice(5,7))-1,1).toLocaleDateString("nl-NL",{month:"long",year:"numeric"});

// Visuele vermogensontwikkeling: gebruik alleen werkelijk opgeslagen maandstanden
// en voeg voor de huidige maand de actuele dashboardstand toe.
const wealthPoints=[];
const wealthFirstKey=[...Object.keys(data.accountSnapshots||{}),...(data.transactions||[]).map(t=>monthKey(t.date))].filter(Boolean).sort()[0];
for(let i=11;i>=0;i--){
  const d=new Date(currentMonth);d.setDate(1);
  d.setMonth(d.getMonth()-i);
  const key=monthKey(d);
  if(wealthFirstKey && key<wealthFirstKey && key!==dashboardSnapshotKey) continue;
  const value=displayedAccountBalances(key).total;
  wealthPoints.push({key,value,label:d.toLocaleDateString("nl-NL",{month:"short"}).replace(".","")});
}
const currentWealth=Number(dashboardAbnBalance||0)+Number(dashboardRevolutBalance||0);
if(!wealthPoints.some(p=>p.key===dashboardSnapshotKey)) wealthPoints.push({key:dashboardSnapshotKey,value:currentWealth,label:new Date(currentMonth).toLocaleDateString("nl-NL",{month:"short"}).replace(".","")});
else wealthPoints.find(p=>p.key===dashboardSnapshotKey).value=currentWealth;
const wealthMax=Math.max(...wealthPoints.map(p=>p.value));
const wealthMin=Math.min(...wealthPoints.map(p=>p.value));
const wealthRange=Math.max(wealthMax-wealthMin,1);
const wealthChange=wealthPoints.length>1?wealthPoints[wealthPoints.length-1].value-wealthPoints[wealthPoints.length-2].value:0;
const wealthChangePct=wealthPoints.length>1 && wealthPoints[wealthPoints.length-2].value!==0
  ? (wealthChange/wealthPoints[wealthPoints.length-2].value)*100 : 0;
const wealthTotalGrowth=wealthPoints.length>1?wealthPoints[wealthPoints.length-1].value-wealthPoints[0].value:0;
const wealthTotalGrowthPct=wealthPoints.length>1 && wealthPoints[0].value!==0
  ? (wealthTotalGrowth/Math.abs(wealthPoints[0].value))*100 : 0;
const wealthMonthDiffs=wealthPoints.slice(1).map((p,i)=>({label:p.label,diff:p.value-wealthPoints[i].value}));
const wealthBestMonth=wealthMonthDiffs.length?wealthMonthDiffs.reduce((a,b)=>b.diff>a.diff?b:a):null;
const wealthWorstMonth=wealthMonthDiffs.length?wealthMonthDiffs.reduce((a,b)=>b.diff<a.diff?b:a):null;
const wealthSvg=wealthPoints.length>1?(()=>{
  const w=360,h=150,padX=12,padT=28,padB=12;
  const n=wealthPoints.length;
  const x=i=>padX+(i/(n-1))*(w-padX*2);
  const y=v=>padT+(1-(v-wealthMin)/wealthRange)*(h-padT-padB);
  const pts=wealthPoints.map((p,i)=>[x(i),y(p.value)]);
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`}
  const last=pts[n-1];
  const lastVal=protectedEuro(wealthPoints[n-1].value);
  const labelY=Math.max(10,last[1]-12);
  const labelX=Math.min(Math.max(last[0],40),w-40);
  return `<div class="wealth-chart-wrap wealth-minimal"><svg class="wealth-chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-label="Vermogensontwikkeling" style="overflow:visible">
    <line x1="0" x2="${w}" y1="${h-padB}" y2="${h-padB}" stroke="var(--border)" stroke-width="1"/>
    <path class="wealth-line" d="${d}" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
    ${pts.map((p,i)=>`<circle class="wealth-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===n-1?4.5:2}" fill="${i===n-1?"var(--primary)":"var(--card)"}" stroke="var(--primary)" stroke-width="${i===n-1?2.5:1.4}"><title>${esc(wealthPoints[i].label)}: ${protectedEuro(wealthPoints[i].value)}</title></circle>`).join("")}
    <text x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text, currentColor)">${lastVal}</text>
  </svg><div class="wealth-labels">${wealthPoints.map((p,i)=>`<span${i===n-1?' style="font-weight:700;opacity:1"':''}>${esc(p.label)}</span>`).join("")}</div></div>`;
})():`<div class="wealth-empty">Sla minimaal twee maandstanden op om je vermogensontwikkeling te zien.</div>`;

const previousDateForTiles=new Date(currentMonth);
previousDateForTiles.setMonth(previousDateForTiles.getMonth()-1);
const previousKeyForTiles=monthKey(previousDateForTiles);
const previousSnapForTiles=data.accountSnapshots?.[previousKeyForTiles];
const previousWealthForTiles=previousSnapForTiles
  ? Number(previousSnapForTiles.acc1||0)+revolutTotal(previousSnapForTiles,previousKeyForTiles)
  : null;
const cashChange=previousWealthForTiles===null?null:currentWealth-previousWealthForTiles;
const tileChange=(value,previousValue)=>{
  if(previousValue===null || !Number.isFinite(previousValue) || previousValue===0)return `<span class="dashboard-tile-change neutral"><i data-lucide="minus"></i>Geen vorige maand</span>`;
  const diff=value-previousValue;
  const pct=(diff/Math.abs(previousValue))*100;
  const up=diff>=0;
  return `<span class="dashboard-tile-change ${up?"up":"down"}"><i data-lucide="${up?"trending-up":"trending-down"}"></i>${diff>=0?"+":"-"}${protectedEuro(Math.abs(diff))} · <span class="tile-change-pct">${diff>=0?"+":"-"}${Math.abs(pct).toFixed(0)}%</span></span>`;
};

const previousIncomeForTiles=previousSnapForTiles?(()=>{
  const monthTs=data.transactions.filter(t=>monthKey(t.date)===previousKeyForTiles);
  const normal=monthTs.filter(t=>t.kind==="income").reduce((s,t)=>s+Number(t.amount||0),0);
  const dp=(data.dealplug?.entries||[]).filter(e=>monthKey(e.date)===previousKeyForTiles&&e.kind==="income").reduce((s,e)=>s+Number(e.amount||0),0);
  return normal+dp;
})():null;
const previousExpenseForTiles=previousSnapForTiles?(()=>{
  const monthTs=data.transactions.filter(t=>monthKey(t.date)===previousKeyForTiles);
  const normal=monthTs.filter(t=>t.kind==="expense").reduce((s,t)=>s+Number(t.amount||0),0);
  const dp=(data.dealplug?.entries||[]).filter(e=>monthKey(e.date)===previousKeyForTiles).reduce((s,e)=>e.dealplugSale?s:(e.kind==="expense"||e.kind==="cost"||e.kind==="kosten"?s+Number(e.amount||0):s),0);
  return normal+dp;
})():null;
const previousNetForTiles=previousIncomeForTiles===null?null:previousIncomeForTiles-previousExpenseForTiles;

$("dashboard").innerHTML=`
<div class="topbar"><div><h1>Dashboard</h1><div class="subtitle">Je financiële overzicht</div></div>
<div class="month-nav"><button class="icon-btn" id="prevMonth"><i data-lucide="chevron-left"></i></button><strong style="min-width:145px;text-align:center;text-transform:capitalize">${monthName()}</strong><button class="icon-btn" id="nextMonth"><i data-lucide="chevron-right"></i></button></div></div>
<div class="cards dashboard-top-cards">
<div class="card dashboard-stat-card"><div class="stat-label"><span class="dashboard-stat-icon"><i data-lucide="wallet"></i></span>Beschikbaar geld</div><div class="stat-value">${protectedEuro(cash)}</div>${tileChange(cash,previousWealthForTiles)}</div>
<div class="card dashboard-stat-card"><div class="stat-label"><span class="dashboard-stat-icon"><i data-lucide="arrow-down-left"></i></span>Deze maand binnen</div><div class="stat-value positive">${protectedEuro(income)}</div>${tileChange(income,previousIncomeForTiles)}</div>
<div class="card dashboard-stat-card"><div class="stat-label"><span class="dashboard-stat-icon"><i data-lucide="arrow-up-right"></i></span>Deze maand eruit</div><div class="stat-value negative">${protectedEuro(expenses)}</div>${tileChange(expenses,previousExpenseForTiles)}</div>
<div class="card dashboard-stat-card"><div class="stat-label"><span class="dashboard-stat-icon"><i data-lucide="${net>=0?"trending-up":"trending-down"}"></i></span>Deze maand saldo</div><div class="stat-value ${net>=0?"positive":"negative"}">${protectedEuro(net)}</div>${tileChange(net,previousNetForTiles)}</div>
</div>

<div class="card dashboard-wealth-card">
  <div class="dashboard-wealth-header">
    <div><div class="section-title">Vermogensontwikkeling</div><div class="small">Totale rekeningstand over de opgeslagen maanden</div></div>
    <div class="dashboard-wealth-current"><span>Huidig</span><strong>${protectedEuro(currentWealth)}</strong></div>
  </div>
  <div class="dashboard-wealth-body">
    <div class="dashboard-wealth-chart">${wealthSvg}</div>
    <div class="dashboard-wealth-summary">
      <div class="dashboard-wealth-summary-item"><span>Verandering</span><strong class="${wealthChange>=0?"positive":"negative"}">${wealthPoints.length>1?(wealthChange>=0?"+":"-")+protectedEuro(Math.abs(wealthChange)):"—"}</strong></div>
      <div class="dashboard-wealth-summary-item"><span>Totale groei</span><strong class="${wealthTotalGrowth>=0?"positive":"negative"}">${wealthPoints.length>1?(wealthTotalGrowth>=0?"+":"-")+protectedEuro(Math.abs(wealthTotalGrowth)):"—"}</strong></div>
      <div class="dashboard-wealth-summary-item"><span>Beste maand</span><strong class="positive">${wealthBestMonth?`${esc(wealthBestMonth.label)} (${wealthBestMonth.diff>=0?"+":"-"}${protectedEuro(Math.abs(wealthBestMonth.diff))})`:"—"}</strong></div>
      <div class="dashboard-wealth-summary-item"><span>Slechtste maand</span><strong class="negative">${wealthWorstMonth?`${esc(wealthWorstMonth.label)} (${wealthWorstMonth.diff>=0?"+":"-"}${protectedEuro(Math.abs(wealthWorstMonth.diff))})`:"—"}</strong></div>
    </div>
  </div>
  <div class="dashboard-wealth-footer">
    <div><span class="small">Groei sinds ${wealthPoints.length>1?esc(wealthPoints[0].label):"start"}</span></div>
    <div class="dashboard-wealth-period">${wealthPoints.length>1?`${wealthPoints[0].label} – ${wealthPoints[wealthPoints.length-1].label}`:"Nog geen historische ontwikkeling"}</div>
    ${wealthPoints.length>1?`<span class="dashboard-wealth-badge ${wealthTotalGrowth>=0?"up":"down"}"><i data-lucide="${wealthTotalGrowth>=0?"trending-up":"trending-down"}"></i>${wealthTotalGrowthPct>=0?"+":"-"}${Math.abs(wealthTotalGrowthPct).toFixed(1)}%</span>`:""}
  </div>
</div>
<div class="section-grid">
<div class="card"><div class="section-title">Rekeningen</div><div class="small" style="margin-bottom:9px">Stand ${dashboardSnapshotLabel}</div><div class="account-list">
<details class="dashboard-abn-details">
<summary class="account dashboard-abn-summary">
<div class="account-left"><div class="account-icon"><i data-lucide="landmark"></i></div><div><strong>ABN Amro</strong><div class="small">Klik voor laatste transacties</div></div></div>
<div class="amount">${protectedEuro(dashboardAbnBalance)}</div>
</summary>
<div class="dashboard-abn-details-inner">
  <div class="small dashboard-subrow-title">Laatste 3 transacties</div>
  <div class="dashboard-account-transactions dashboard-account-transactions-scroll">
    ${abnRecentTransactions.length?abnRecentTransactions.map(compactAccountTransaction).join(""):`<div class="small">Nog geen ABN-transacties</div>`}
  </div>
</div>
</details>
<details class="dashboard-revolut-details">
<summary class="account dashboard-revolut-summary">
<div class="account-left"><div class="account-icon"><i data-lucide="wallet"></i></div><div><strong>Revolut</strong><div class="small">Klik om rekeningen te bekijken</div></div></div>
<div class="amount">${protectedEuro(dashboardRevolutBalance)}</div>
</summary>
<div class="dashboard-revolut-details-inner">
  <div class="dashboard-revolut-subaccount">
    <div class="small dashboard-subrow"><span>Revolut privé</span><strong>${protectedEuro(displayedBalances.privateRevolut)}</strong></div>
    <div class="dashboard-account-transactions revolut-subaccount-transactions">
      ${revolutPrivateRecentTransactions.length?revolutPrivateRecentTransactions.map(compactAccountTransaction).join(""):`<div class="small dashboard-no-transactions">Nog geen transacties</div>`}
    </div>
  </div>

  <div class="dashboard-revolut-subaccount">
    <div class="small dashboard-subrow"><span>DealPlugNL</span><strong>${protectedEuro(displayedBalances.dealplug)}</strong></div>
    <div class="dashboard-account-transactions revolut-subaccount-transactions">
      ${dealplugRecentTransactions.length?dealplugRecentTransactions.map(compactAccountTransaction).join(""):`<div class="small dashboard-no-transactions">Nog geen transacties</div>`}
    </div>
  </div>

  <div class="dashboard-revolut-subaccount">
    <div class="small dashboard-subrow"><span>Crypto / Aandelen</span><strong>${protectedEuro(displayedBalances.crypto)}</strong></div>
    <div class="dashboard-account-transactions revolut-subaccount-transactions">
      ${cryptoRecentTransactions.length?cryptoRecentTransactions.map(compactAccountTransaction).join(""):`<div class="small dashboard-no-transactions">Nog geen transacties</div>`}
    </div>
  </div>

</div>
</details>
</div>
${(()=>{
  const currentTotal=Number(dashboardSnapshot.acc1||0)+revolutTotal(dashboardSnapshot,dashboardSnapshotKey);
  const previousDate=new Date(currentMonth);
  previousDate.setMonth(previousDate.getMonth()-1);
  const previousKey=monthKey(previousDate);
  const previousSnapshot=data.accountSnapshots?.[previousKey];
  if(!previousSnapshot){
    return '<div class="account-change flat"><i data-lucide="minus"></i><span>Geen vorige maand beschikbaar</span></div>';
  }
  const previousTotal=Number(previousSnapshot.acc1||0)+revolutTotal(previousSnapshot,previousKey);
  const difference=currentTotal-previousTotal;
  if(difference>0){
    return `<div class="account-change up"><i data-lucide="trending-up"></i><span>${protectedEuro(difference)} meer dan vorige maand</span></div>`;
  }
  if(difference<0){
    return `<div class="account-change down"><i data-lucide="trending-down"></i><span>${protectedEuro(Math.abs(difference))} minder dan vorige maand</span></div>`;
  }
  return '<div class="account-change flat"><i data-lucide="minus"></i><span>Gelijk aan vorige maand</span></div>';
})()}
</div>
</div>

<div class="quick-grid quick-grid-6"><button class="quick-btn" data-quick-tile="Boodschappen"><i data-lucide="shopping-cart"></i><strong>Boodschappen</strong></button><button class="quick-btn" data-quick-tile="Uit eten"><i data-lucide="utensils"></i><strong>Uit eten</strong></button><button class="quick-btn" data-quick-tile="Auto"><i data-lucide="car"></i><strong>Auto</strong></button><button class="quick-btn" data-quick-tile="Kleding"><i data-lucide="shirt"></i><strong>Kleding</strong></button><button class="quick-btn" data-quick-tile="Creditcard"><i data-lucide="credit-card"></i><strong>Creditcard</strong></button><button class="quick-btn" data-quick-tile="Overige"><i data-lucide="more-horizontal"></i><strong>Overige</strong></button></div>

// AI-categorie: werkt in de gepubliceerde Lovable-app; vul AI_ENDPOINT voor GitHub-versie.
const AI_ENDPOINT=/lovable\.app$|localhost/.test(location.hostname)?"/api/public/categorize":(window.BUDGET_AI_ENDPOINT||"");
let quickAiTimer=null,quickAiSeq=0;
async function quickAiCategorize(){
  if(quickTile!=="Overige")return;
  const text=$("quickOtherDescription").value.trim();
  const status=$("quickAiStatus");
  if(text.length<2||!AI_ENDPOINT){status.textContent="";return}
  const seq=++quickAiSeq;status.textContent="· AI kiest categorie…";
  try{
    const r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:text})});
    const d=await r.json();
    if(seq!==quickAiSeq)return;
    if(!r.ok||!d.category){status.textContent="";notify(d.error||"AI kon geen categorie kiezen.");return}
    $("quickOtherCategory").value=d.category;status.textContent="· AI: "+d.category;
  }catch(e){if(seq===quickAiSeq)status.textContent=""}
}
$("quickOtherDescription").oninput=()=>{clearTimeout(quickAiTimer);quickAiTimer=setTimeout(quickAiCategorize,700)};
$("quickOtherCategory").onchange=()=>{$("quickAiStatus").textContent=""};

if(!quickTile)return;
const category=quickTile==="Overige"?$("quickOtherCategory").value:quickTile;

if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldig bedrag in.");return}
const description=$("quickOtherDescription").value.trim();
quickExpense(category,amount,description||category);
$("quickOtherAmount").value="";
$("quickOtherDescription").value="";
$("quickAiStatus").textContent="";
};

const type=btn.dataset.quickIncome;
const label=type==="dealplug"?"Verkoop DealPlugNL":"Loon uit werk";

if(entered===null)return;
const amount=Number(String(entered).replace(",",".").trim());
if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldig bedrag in.");return}
if(type==="dealplug")addDealPlugEntry("income",amount,"Verkoop abonnement");
else addWorkIncome(amount);
});
}

function quickExpense(category,amount,description){
  // Snelle uitgaven worden net als gewone uitgaven van de
  // ABN Amro spaarrekening afgeboekt.
  const savingsAccount=accountById("acc2");
  if(!savingsAccount){notify("ABN Amro spaarrekening niet gevonden.");return}
  if(Number(savingsAccount.balance||0)<amount){
    notify(`Onvoldoende saldo op ${savingsAccount.name}. Beschikbaar: ${euro(savingsAccount.balance)}.`);
    return;
  }

  savingsAccount.balance-=amount;
  const tx={
    id:uid(),
    description:description||category,
    amount,
    date:today(),
    category,
    accountId:savingsAccount.id,
    kind:"expense",
    quickOnly:true
  };
  data.transactions.push(tx);
  saveAndRender();
}
function addWorkIncome(amount){
const acc=data.accounts[0];
if(!acc){notify("Geen spaarrekening gevonden.");return}
data.transactions.push({id:uid(),description:"Loon uit werk",amount,date:today(),category:"Salaris",accountId:acc.id,kind:"income"});
acc.balance+=amount;saveAndRender();
}
function addCryptoContribution(amount){
data.cryptoEntries.push({id:uid(),type:"in",amount,date:today(),description:"Crypto inleg"});
data.crypto=(Number(data.crypto)||0)+amount;saveAndRender();
}
function addDealPlugEntry(kind,amount,description){
data.dealplug.entries.push({id:uid(),kind,amount,date:today(),description});saveAndRender();
}

function transactionRow(t,full){
const acc=accountById(t.accountId);
const to=accountById(t.toAccountId);
const sign=t.kind==="income"?"+":t.kind==="transfer"||t.kind==="revolutTransfer"?"↔":t.kind==="revolutAdjustment"?(t.direction==="add"?"+":"-"):"-";
const cls=t.kind==="income"||t.kind==="revolutAdjustment"&&t.direction==="add"?"positive":t.kind==="expense"||t.kind==="revolutAdjustment"&&t.direction==="remove"?"negative":"";
const accountLabel=t.kind==="revolutAdjustment"?({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.target]||"Revolut"):t.kind==="revolutTransfer"?`${({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.fromTarget]||"Revolut")} → ${({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.toTarget]||"Revolut")}`:(t.quickOnly?"Uitgavenregistratie":(acc?.name||"-"));
const categoryLabel=t.kind==="revolutAdjustment"?"Revolut mutatie":t.category;
const txTime=dashboardTransactionTime(t);
const txDate=new Date(t.date).toLocaleDateString("nl-NL");
const txTimeText=Number.isFinite(txTime)&&txTime>0?new Date(txTime).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}):"";
return `<tr><td>${esc(t.description)}</td><td><span class="badge">${esc(categoryLabel)}</span></td><td><span class="transaction-date">${txDate}<small>${txTimeText}</small></span></td>${full?`<td>${esc(accountLabel)}${t.kind==="transfer"&&to?` → ${esc(to.name)}`:""}</td>`:""}<td class="${cls}">${sign}${protectedEuro(t.amount)}</td>${full?`<td><div class="actions"><button data-edit="${t.id}" title="Bewerken"><i data-lucide="pencil"></i></button><button data-delete="${t.id}" class="danger" title="Verwijderen"><i data-lucide="trash-2"></i></button></div></td>`:""}</tr>`;
}

  <div class="form-grid">

<div class="card transactions"><div class="section-title">Transacties</div>
${ts.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Omschrijving</th><th>Categorie</th><th>Datum</th><th>Rekening</th><th>Bedrag</th><th></th></tr></thead><tbody>${ts.map(t=>transactionRow(t,true)).join("")}</tbody></table></div>`:`<div class="empty">Nog geen transacties.</div>`}</div>`;

let kind="income";
document.querySelectorAll("#transactionForm [data-kind]").forEach(btn=>btn.onclick=()=>{
kind=btn.dataset.kind;
document.querySelectorAll("#transactionForm [data-kind]").forEach(x=>x.classList.toggle("active",x===btn));
$("transferField").style.display=kind==="transfer"?"block":"none";
$("categoryField").style.display=kind==="transfer"?"none":"block";
$("accountLabel").textContent=kind==="transfer"?"Van rekening":"Rekening";
});
$("transactionForm").onsubmit=e=>{
e.preventDefault();
const description=$("description").value.trim();
const amount=Number($("amount").value);
const date=$("date").value;
const accountId=$("account").value;
if(!description){notify("Vul een omschrijving in.");return}
if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldig bedrag in.");return}
if(!date){notify("Kies een datum.");return}
if(kind==="transfer"){
const from=accountById(accountId),to=accountById($("transferTo").value);
if(!from||!to||from.id===to.id){notify("Kies twee verschillende rekeningen.");return}

// Gebruik voor de saldo-check dezelfde maandstanden als het dashboard.
// ABN Amro wordt in de maandstanden als acc1 opgeslagen, terwijl de
// transactiekeuze acc2 gebruikt. Revolut privé gebruikt acc4.
const month=monthKey(new Date(date));
const snap=data.accountSnapshots?.[month];
const transferEffect=(ids)=>data.transactions.filter(t=>monthKey(t.date)===month).reduce((sum,t)=>{
  const n=Number(t.amount||0);
  if(t.kind==="income" && ids.includes(t.accountId)) return sum+n;
  if(t.kind==="expense" && ids.includes(t.accountId)) return sum-n;
  if(t.kind==="transfer"){
    if(ids.includes(t.accountId)) sum-=n;
    if(ids.includes(t.toAccountId)) sum+=n;
  }
  return sum;
},0);
// Gebruik exact hetzelfde actuele saldo als de rekeningtegels op het
// dashboard/transacties. Daardoor worden eerdere overboekingen meteen
// meegenomen in de volgende saldo-check.
const balancesBeforeTransfer=displayedAccountBalances(month);
const sourceBalance=from.id==="acc2"
  ? Number(balancesBeforeTransfer.abn||0)
  : from.id==="acc4"
    ? Number(balancesBeforeTransfer.privateRevolut||0)
    : Number(from.balance||0);
if(sourceBalance+0.000001<amount){
  notify(`Overboeking geweigerd: onvoldoende saldo op ${from.name}. Beschikbaar: ${euro(sourceBalance)}.`);
  return;
}

from.balance-=amount;
to.balance+=amount;

// Een overboeking verandert NOOIT de opgeslagen maandstand.
// De maandstand is een vast historisch meetpunt; de actuele rekeningstanden
// worden hierboven bijgewerkt en de overboeking blijft als transactie geregistreerd.
data.transactions.push({id:uid(),description,amount,date,category:"Overboeking",accountId:from.id,toAccountId:to.id,kind:"transfer"});
}else{
const acc=accountById(accountId);
if(!acc){notify("Kies een rekening.");return}

// Een gewone inkomsten-/kostentransactie verandert ook het actuele saldo
// van de gekozen rekening. De opgeslagen maandstand blijft een historisch
// snapshot; alleen de actuele maandrekening wordt live bijgewerkt.
const transactionMonth=monthKey(new Date(date));
if(transactionMonth===monthKey(new Date())){
  if(kind==="expense") {
    if(Number(acc.balance||0)+0.000001<amount){
      notify(`Transactie geweigerd: onvoldoende saldo op ${acc.name}. Beschikbaar: ${euro(acc.balance||0)}.`);
      return;
    }
    acc.balance-=amount;
  } else if(kind==="income") {
    acc.balance+=amount;
  }
}

data.transactions.push({id:uid(),description,amount,date,category:$("category").value,accountId,kind});
}
saveAndRender();
};
function changeRevolutSubaccountAmount(target, amount, direction, note){
  const n=Number(amount);
  if(!Number.isFinite(n)||n<=0){notify("Vul een geldig bedrag in.");return}
  const month=monthKey(currentMonth);
  data.accountSnapshots=data.accountSnapshots||{};
  const snap=data.accountSnapshots[month]||(data.accountSnapshots[month]={});
  snap.revolutSubaccounts=snap.revolutSubaccounts||{};
  const label=target==="private"?"Revolut privé":target==="dealplug"?"DealPlugNL":"Crypto / Aandelen";
  const current=target==="private"?Number(snap.acc4||0):Number(snap.revolutSubaccounts[target]||0);
  const next=direction==="remove"?current-n:current+n;
  if(next<0){notify(`Onvoldoende saldo op ${label}.`);return}
  if(target==="private") snap.acc4=next;
  else snap.revolutSubaccounts[target]=next;

  const tx={
    id:uid(),
    description:String(note||label).trim()||label,
    amount:n,
    date:today(),
    category:"Revolut mutatie",
    accountId:"revolut-subaccount",
    kind:"revolutAdjustment",
    target,
    direction,
    note:String(note||"").trim(),
    month
  };
  data.transactions.push(tx);
  persist();
  render();
  notify(`${euro(n)} ${direction==="remove"?"afgehaald van":"toegevoegd aan"} ${label}.`);
}

function editTransaction(tid){
const t=data.transactions.find(x=>x.id===tid);if(!t)return;
const val=prompt("Nieuw bedrag (€):",String(t.amount));
if(val===null)return;
const n=Number(val);if(!Number.isFinite(n)||n<=0){notify("Ongeldig bedrag.");return}
if(t.kind==="revolutTransfer"){
  const privateAccount=accountById("acc4");
  // Eerst de oude beweging terugdraaien op het actuele saldo.
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance+=Number(t.amount||0);
    if(t.toTarget==="private") privateAccount.balance-=Number(t.amount||0);
  }
  // Controleer daarna het nieuwe bedrag vanuit de herstelde actuele bron.
  const displayed=displayedAccountBalances(t.month);
  const sourceBefore=t.fromTarget==="private"
    ? Number(privateAccount?.balance||0)
    : t.fromTarget==="dealplug" ? Number(displayed.dealplug||0) : Number(displayed.crypto||0);
  if(sourceBefore<n){notify("Onvoldoende saldo voor dit nieuwe bedrag.");return}
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance-=n;
    if(t.toTarget==="private") privateAccount.balance+=n;
  }
  t.amount=n;
  persist();render();
  return;
}

// Alle overige soorten: eerst het oude effect terugdraaien, daarna het nieuwe bedrag
// toepassen. De transactie zelf blijft bestaan (alleen het bedrag verandert).
const oldAmount=Number(t.amount||0);
const snapForAdj=t.kind==="revolutAdjustment"?data.accountSnapshots?.[t.month]:null;
const adjKey=t.target==="private"?"acc4":null;
const readAdj=()=>{
  if(!snapForAdj)return 0;
  snapForAdj.revolutSubaccounts=snapForAdj.revolutSubaccounts||{};
  return adjKey?Number(snapForAdj[adjKey]||0):Number(snapForAdj.revolutSubaccounts[t.target]||0);
};
const writeAdj=v=>{
  if(!snapForAdj)return;
  if(adjKey)snapForAdj[adjKey]=v;else snapForAdj.revolutSubaccounts[t.target]=v;
};
const sameMonthAsNow=monthKey(new Date(t.date))===monthKey(new Date());
const reverse=amount=>{
  if(t.kind==="revolutAdjustment"){
    writeAdj(t.direction==="add"?readAdj()-amount:readAdj()+amount);
  }else if(t.kind==="transfer"){
    const from=accountById(t.accountId),to=accountById(t.toAccountId);
    if(from)from.balance+=amount;
    if(to)to.balance-=amount;
  }else if(t.kind==="income"||t.kind==="expense"){
    const acc=accountById(t.accountId);
    if(acc&&sameMonthAsNow){
      if(t.kind==="income")acc.balance-=amount;else acc.balance+=amount;
    }
  }
};
const apply=amount=>{
  if(t.kind==="revolutAdjustment"){
    writeAdj(t.direction==="add"?readAdj()+amount:readAdj()-amount);
  }else if(t.kind==="transfer"){
    const from=accountById(t.accountId),to=accountById(t.toAccountId);
    if(from)from.balance-=amount;
    if(to)to.balance+=amount;
  }else if(t.kind==="income"||t.kind==="expense"){
    const acc=accountById(t.accountId);
    if(acc&&sameMonthAsNow){
      if(t.kind==="income")acc.balance+=amount;else acc.balance-=amount;
    }
  }
};
reverse(oldAmount);
// Controleer of het nieuwe bedrag past; zo niet, terugzetten zoals het was.
let blocked="";
if(t.kind==="revolutAdjustment"&&((t.direction==="remove"&&readAdj()-n<0)||(t.direction!=="remove"&&readAdj()+n<0))){
  blocked="Onvoldoende saldo voor dit nieuwe bedrag.";
}else if(t.kind==="transfer"){
  const from=accountById(t.accountId);
  if(from&&Number(from.balance||0)+0.000001<n)blocked=`Onvoldoende saldo op ${from.name} voor dit nieuwe bedrag.`;
}else if(t.kind==="expense"&&sameMonthAsNow){
  const acc=accountById(t.accountId);
  if(acc&&Number(acc.balance||0)+0.000001<n)blocked=`Onvoldoende saldo op ${acc.name} voor dit nieuwe bedrag.`;
}
if(blocked){
  apply(oldAmount);
  notify(blocked);
  return;
}
apply(n);
t.amount=n;
saveAndRender();
}

function deleteTransaction(tid){
const t=data.transactions.find(x=>x.id===tid);if(!t)return;
if(!confirm("Deze transactie verwijderen?"))return;
if(t.kind==="revolutTransfer"){
  const privateAccount=accountById("acc4");
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance+=Number(t.amount||0);
    if(t.toTarget==="private") privateAccount.balance-=Number(t.amount||0);
  }
}else if(t.kind==="revolutAdjustment"){
  const snap=data.accountSnapshots?.[t.month];
  if(snap){
    snap.revolutSubaccounts=snap.revolutSubaccounts||{};
    const current=t.target==="private"?Number(snap.acc4||0):Number(snap.revolutSubaccounts[t.target]||0);
    const next=t.direction==="add"?current-t.amount:current+t.amount;
    if(t.target==="private")snap.acc4=Math.max(0,next);else snap.revolutSubaccounts[t.target]=Math.max(0,next);
  }
}else if(t.kind==="transfer"){
  const from=accountById(t.accountId),to=accountById(t.toAccountId);
  if(from)from.balance+=t.amount;
  if(to)to.balance-=t.amount;
}else if(t.kind==="income"||t.kind==="expense"){
  const acc=accountById(t.accountId);
  if(acc && monthKey(new Date(t.date))===monthKey(new Date())){
    if(t.kind==="income") acc.balance-=Number(t.amount||0);
    else acc.balance+=Number(t.amount||0);
  }
}
data.transactions=data.transactions.filter(x=>x.id!==tid);saveAndRender();
}

let selectedSnapshotMonth="";

// DealPlugNL-saldo: verkoopbedragen komen volledig binnen op Revolut-DP.
// Inkoopkosten van een verkoop worden als gekoppelde uitgave op ABN geboekt
// (data.transactions) en mogen daarom NOOIT nogmaals van het DP-saldo af.
// Alleen losse DealPlugNL-kosten verminderen het DP-saldo.
function dealplugEntryCashEffect(entry){
  if(!entry) return 0;
  const amount=Number(entry.amount||0);
  if(!Number.isFinite(amount)) return 0;
  if(entry.dealplugSale) return amount; // alleen de verkoopprijs; entry.cost is ABN-kosten
  if(entry.kind==="income") return amount;
  if(entry.kind==="expense"||entry.kind==="cost"||entry.kind==="kosten") return -amount;
  return 0;
}
function dealplugNetForMonth(month){
  const entries=Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[];
  return entries.filter(e=>monthKey(e.date)===month)
    .reduce((sum,e)=>sum+dealplugEntryCashEffect(e),0);
}
function dealplugBalanceForMonth(month,snapshot){
  return Number(snapshot?.revolutSubaccounts?.dealplug||0)+dealplugNetForMonth(month);
}
function revolutPrivateCurrentBalance(month){
  return Number(displayedAccountBalances(month).privateRevolut||0);
}

function revolutPrivateBalance(snapshot){
  // Gebruik de maandstand als die expliciet is opgeslagen. Als die nog niet
  // bestaat, gebruik dan het actuele Revolut-saldo uit de rekeninggegevens.
  if(snapshot && Object.prototype.hasOwnProperty.call(snapshot,"acc4")){
    return Number(snapshot.acc4||0);
  }
  const acc=accountById("acc4");
  return Number(acc?.balance||0);
}
function revolutSubTotal(snapshot,month){
  const subs=snapshot?.revolutSubaccounts||{};
  const dealplug=month?dealplugBalanceForMonth(month,snapshot):Number(subs.dealplug||0);
  const crypto=Number(subs.crypto||0);
  // Crypto / Aandelen blijft een aparte subrekening, maar telt wel mee in
  // het totale Revolut-saldo.
  return dealplug+crypto;
}
function revolutTotal(snapshot,month){
  return revolutPrivateBalance(snapshot)+revolutSubTotal(snapshot,month);
}

$("saveSnapshotBtn").onclick=()=>{
  const monthToSave=selectedSnapshotMonth;
  if(!monthToSave){notify("Kies eerst een maand.");return;}

  data.accountSnapshots=data.accountSnapshots||{};
  data.accountSnapshots[monthToSave]=data.accountSnapshots[monthToSave]||{};
  const snap=data.accountSnapshots[monthToSave];

  document.querySelectorAll("[data-snapshot-account]").forEach(input=>{
    const raw=String(input.value||"").replace(",", ".").trim();
    const value=raw===""?0:Number(raw);
    const cleanValue=Number.isFinite(value)?value:0;
    snap[input.dataset.snapshotAccount]=cleanValue;

    // Bij het opslaan van de stand van de huidige maand moet die ingevoerde stand
    // ook de actuele account-state worden. Dashboard en Transacties lezen daarna
    // exact dezelfde bron voor het huidige saldo.
    if(monthToSave===monthKey(new Date()) && input.dataset.snapshotAccount==="acc1") {
      const abnAccount=accountById("acc2");
      if(abnAccount) abnAccount.balance=cleanValue;
    }
  });

  snap.revolutSubaccounts=snap.revolutSubaccounts||{};
  document.querySelectorAll("[data-snapshot-subaccount]").forEach(input=>{
    const raw=String(input.value||"").replace(",", ".").trim();
    const value=raw===""?0:Number(raw);
    const id=input.dataset.snapshotSubaccount;
    if(id==="private") {
      // Revolut privé is de actuele hoofdrekening. Bij de huidige maand
      // synchroniseren we de ingevoerde stand ook naar acc4.
      const cleanValue=Number.isFinite(value)?value:0;
      snap.acc4=cleanValue;
      if(monthToSave===monthKey(new Date())) {
        const revolutAccount=accountById("acc4");
        if(revolutAccount) revolutAccount.balance=cleanValue;
      }
    } else if(id==="dealplug") {
      snap.revolutSubaccounts[id]=Number.isFinite(value)?value-dealplugNetForMonth(monthToSave):0;
    } else {
      snap.revolutSubaccounts[id]=Number.isFinite(value)?value:0;
    }
  });

  const parts=monthToSave.split("-").map(Number);
  if(parts.length===2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])){
    currentMonth=new Date(parts[0],parts[1]-1,1);
  }

  persist();
  render();
  notify("Rekeningstanden opgeslagen en dashboard bijgewerkt.");

function renderCrypto(){
  const entries=[...data.cryptoEntries].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const cryptoEntries=entries.filter(e=>(e.assetType||"crypto")==="crypto");
  const pokemonEntries=entries.filter(e=>(e.assetType||"crypto")==="pokemon");

  const cryptoInvested=cryptoEntries.filter(e=>e.type==="in").reduce((s,e)=>s+Number(e.amount),0);
  const cryptoCashouts=cryptoEntries.filter(e=>e.type==="out").reduce((s,e)=>s+Number(e.amount),0);
  const cryptoResult=cryptoCashouts-cryptoInvested;
  const cryptoOpen=Math.max(0,cryptoInvested-cryptoCashouts);

  const legacyPokemonInvested=pokemonEntries.filter(e=>e.type==="in").reduce((s,e)=>s+Number(e.amount),0);
  const legacyPokemonCashouts=pokemonEntries.filter(e=>e.type==="out").reduce((s,e)=>s+Number(e.amount),0);
  const legacyPokemonResult=legacyPokemonCashouts-legacyPokemonInvested;
  const legacyPokemonOpen=Math.max(0,legacyPokemonInvested-legacyPokemonCashouts);

  const pokemonCards=Array.isArray(data.pokemonCards)?data.pokemonCards:[];
  const pokemonHeldCards=pokemonCards.filter(c=>c.status!=="sold");
  const pokemonSoldCards=pokemonCards.filter(c=>c.status==="sold");
  const pokemonCardPurchaseTotal=pokemonCards.reduce((sum,c)=>sum+Number(c.purchasePrice||0),0);
  const pokemonHeldCost=pokemonHeldCards.reduce((sum,c)=>sum+Number(c.purchasePrice||0),0);
  const pokemonSoldCost=pokemonSoldCards.reduce((sum,c)=>sum+Number(c.purchasePrice||0),0);
  const pokemonSalesTotal=pokemonSoldCards.reduce((sum,c)=>sum+Number(c.salePrice||0),0);
  const pokemonCardRealized=pokemonSalesTotal-pokemonSoldCost;

  // De historische inleg is een eenmalig startpunt. Nieuwe kaartregistraties
  // worden daar bovenop gevolgd; zo hoeft de gebruiker oude aankopen niet terug
  // te reconstrueren. De actuele marktwaarde van de collectie kan handmatig
  // worden bijgehouden, zodat ongerealiseerde winst/verlies zichtbaar wordt.
  const pokemonInitial=Number(data.pokemonInitialInvestment||0);
  const pokemonOpen=pokemonInitial+legacyPokemonOpen+pokemonHeldCost;
  const pokemonTotalInvested=pokemonInitial+legacyPokemonInvested+pokemonCardPurchaseTotal;
  const pokemonTotalCashouts=legacyPokemonCashouts+pokemonSalesTotal;
  const pokemonResult=legacyPokemonResult+pokemonCardRealized;
  // Huidige waarde = de eerder opgeslagen huidige waarde van de bestaande collectie
  // + de actuele waarde van nieuw geregistreerde kaarten die nog in bezit zijn.
  // De historische inleg staat hier bewust los van.
  const pokemonCardCurrentValue=pokemonHeldCards.reduce((sum,c)=>sum+Number(c.currentValue||0),0);
  const pokemonCurrentValue=Number(data.pokemonCurrentValue||0)+pokemonCardCurrentValue;
  const pokemonOpenCost=Math.max(0,pokemonTotalInvested-pokemonSoldCost-legacyPokemonCashouts);
  const pokemonUnrealized=pokemonCurrentValue-pokemonOpenCost;
  const pokemonTotalReturn=pokemonResult+pokemonUnrealized;

  data.crypto=cryptoInvested;

  $("crypto").innerHTML=`
  <div class="topbar">

    const oldValueRaw=String($("pokemonOldCollectionValue").value||"").replace(",",".").trim();

    if(!Number.isFinite(currentValue)||currentValue<0){notify("Vul een geldige huidige waarde in.");return}

    if(!card)return;
    const entered=prompt(`Huidige waarde voor ${card.name||"deze kaart"}: (€)`,Number(card.currentValue||0).toFixed(2));

    const value=Number(String(entered).replace(",",".").trim());
    if(!Number.isFinite(value)||value<0){notify("Vul een geldige huidige waarde in.");return}

    saveAndRender();

      card.status="held";
      card.salePrice=0;
      card.saleDate="";
      saveAndRender();
      return;
    }

    const entered=prompt(`Voor hoeveel heb je ${card.name||"deze kaart"} verkocht? (€)`,`0`);
    if(entered===null)return;
    const salePrice=Number(String(entered).replace(",",".").trim());
    if(!Number.isFinite(salePrice)||salePrice<0){notify("Vul een geldig verkoopbedrag in.");return}

    card.status="sold";
    card.salePrice=salePrice;
    card.saleDate=today();
    saveAndRender();
  });

  document.querySelectorAll("[data-pokemon-delete]").forEach(btn=>btn.onclick=()=>{

    data.pokemonCards=data.pokemonCards.filter(c=>c.id!==id);
    saveAndRender();
  });

  // Onderaan de Pokémon-pagina staat één compact Pokémon-overzicht.

  lucide.createIcons();

return `<tr><td>${esc(e.description)}</td><td>${new Date(e.date).toLocaleDateString("nl-NL")}</td><td>${typeLabel}</td><td class="${e.kind==="income"?"positive":"negative"}">${e.kind==="income"?"+":"-"}${amountLabel}${isSale&&Number(e.cost||0)>0?` <span class="small">(kosten ${protectedEuro(e.cost)})</span>`:""}</td><td><button class="icon-btn danger" data-dp-delete="${e.id}"><i data-lucide="trash-2"></i></button></td></tr>`;
}).join("")}</tbody></table></div>`:`<div class="empty">Nog geen DealPlugNL-verkopen of kosten.</div>`}</div>`;
$("saveDpOpening").onclick=()=>{const n=Number($("dpOpening").value);if(!Number.isFinite(n)){notify("Ongeldige beginstand.");return}data.dealplug.opening=n;saveAndRender()};
let kind="sale";
const setDpMode=(mode)=>{
  kind=mode;
  document.querySelectorAll("#dpForm [data-dpkind]").forEach(x=>x.classList.toggle("active",x.dataset.dpkind===mode));
  const sale=mode==="sale";
  $("dpSaleFields").style.display=sale?"block":"none";
  $("dpSimpleFields").style.display=sale?"none":"block";
  $("dpSaleAmount").required=sale;
  $("dpAmount").required=!sale;
  $("dpSubmitLabel").textContent=sale?"Verkoop toevoegen":mode==="income"?"Inkomst toevoegen":"Kosten toevoegen";
};
document.querySelectorAll("#dpForm [data-dpkind]").forEach(b=>b.onclick=()=>setDpMode(b.dataset.dpkind));
$("dpForm").onsubmit=e=>{
  e.preventDefault();
  if(kind==="sale"){
    const amount=Number($("dpSaleAmount").value);
    const cost=Math.max(0,Number($("dpSaleCost").value||0));
    const description="Verkoop";
    const date=$("dpSaleDate").value;
    const costAccountId=$("dpCostAccount").value;
    const costAccount=accountById(costAccountId);
    if(!description){notify("Vul een omschrijving in.");return}
    if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldige verkoopprijs in.");return}
    if(!Number.isFinite(cost)||cost<0){notify("Vul geldige inkoopkosten in.");return}
    if(!date){notify("Kies een datum.");return}
    if(cost>0&&!costAccount){notify("Kostenrekening niet gevonden.");return}
    const saleId=uid();
    const costTxId=uid();
    data.dealplug.entries.push({id:saleId,kind:"income",amount,date,description,dealplugSale:true,cost,linkedCostTransactionId:costTxId});
    if(cost>0){
      costAccount.balance-=cost;
      data.transactions.push({id:costTxId,description:`Inkoopkosten — ${description}`,amount:cost,date,category:"DealPlugNL kosten",accountId:costAccountId,kind:"expense",dealplugLinked:true,dealplugSaleId:saleId});
    }
    saveAndRender();
    notify(`${euro(amount)} verkoop toegevoegd. ${euro(cost)} kosten via ${costAccount?.name||"rekening"}. Nettowinst: ${euro(amount-cost)}.`);
    return;
  }
  const amount=Number($("dpAmount").value);
  const description=kind==="income"?"DealPlugNL inkomst":"DealPlugNL kosten";
  const date=$("dpDate").value;
  if(!description){notify("Vul een omschrijving in.");return}
  if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldig bedrag in.");return}
  if(!date){notify("Kies een datum.");return}
  data.dealplug.entries.push({id:uid(),kind,amount,date,description});
  saveAndRender();
};
document.querySelectorAll("[data-dp-delete]").forEach(b=>b.onclick=()=>{
  if(!confirm("Deze DealPlugNL-post verwijderen?")) return;
  const entry=data.dealplug.entries.find(e=>e.id===b.dataset.dpDelete);
  if(entry?.dealplugSale){
    const linkedId=entry.linkedCostTransactionId;
    const tx=data.transactions.find(t=>t.id===linkedId);
    if(tx?.accountId){const acc=accountById(tx.accountId);if(acc) acc.balance+=Number(tx.amount||0);}
    data.transactions=data.transactions.filter(t=>t.id!==linkedId);
  }
  data.dealplug.entries=data.dealplug.entries.filter(e=>e.id!==b.dataset.dpDelete);
  saveAndRender();
});
setDpMode("sale");
}

  $("goals").innerHTML=`<div class="topbar"><div><h1>Spaardoelen</h1><div class="subtitle">Bouw gericht aan je financiële doelen</div></div></div>
  <div class="card"><div class="section-title">Spaardoel toevoegen</div><form id="goalForm"><div class="goal-form-grid"><div class="field"><label>Naam</label><input id="goalName" required placeholder="Bijv. Miami trip"></div><div class="field"><label>Doelbedrag (€)</label><input id="goalTarget" type="number" min="0.01" step=".01" required inputmode="decimal"></div><div class="field"><label>Huidig bedrag (€)</label><input id="goalCurrent" type="number" min="0" step=".01" value="0" inputmode="decimal"></div></div><div class="form-actions"><button class="btn primary"><i data-lucide="plus"></i>Doel opslaan</button></div></form></div>
