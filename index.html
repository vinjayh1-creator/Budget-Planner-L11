  document.querySelectorAll("[data-goal-add]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.goalAdd);const n=Number(String(prompt("Hoeveel wil je toevoegen? (€)")||"").replace(",","."));if(!Number.isFinite(n)||n<=0)return;data.goals[i].current=Number(data.goals[i].current||0)+n;saveAndRender()});
  document.querySelectorAll("[data-goal-delete]").forEach(b=>b.onclick=()=>{if(confirm("Spaardoel verwijderen?")){data.goals.splice(Number(b.dataset.goalDelete),1);saveAndRender()}});
}

function renderRecurring(){
$("recurring").innerHTML=`<div class="topbar"><div><h1>Terugkerend</h1><div class="subtitle">Vaste inkomsten en kosten automatisch verwerken</div></div></div>
<div class="card"><div class="section-title">Wekelijks loon</div><div class="small" style="margin-bottom:14px">Automatisch iedere woensdag als inkomen toevoegen. Als je de app later in de week opent, wordt het loon van die woensdag alsnog geregistreerd.</div>
<div class="form-grid"><div class="field"><label>Bedrag (€)</label><input id="weeklySalaryAmount" type="number" min="0.01" step=".01" inputmode="decimal" placeholder="Bijv. 550" value="${data.weeklySalary?.amount||""}"></div><div class="field"><label>Op rekening</label><select id="weeklySalaryAccount">${data.accounts.map(a=>`<option value="${a.id}" ${a.id===(data.weeklySalary?.accountId||data.accounts[0]?.id)?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div></div>
<div class="form-actions"><label class="toggle" style="display:flex;align-items:center;gap:10px"><input id="weeklySalaryEnabled" type="checkbox" ${data.weeklySalary?.enabled?"checked":""}> Inschakelen</label><button type="button" class="btn primary" id="saveWeeklySalary">Opslaan</button></div></div>
<div class="notice"><i data-lucide="info"></i> Op de gekozen dag wordt de transactie automatisch één keer per maand toegevoegd. Een uitgave wordt alleen verwerkt als er voldoende saldo is.</div>
<div class="card"><div class="section-title">Terugkerende transactie toevoegen</div><form id="recForm"><div class="toggle"><button type="button" data-reckind="expense" class="active">Uitgave</button><button type="button" data-reckind="income">Inkomst</button></div>
<div class="form-grid"><div class="field"><label>Omschrijving</label><input id="recDesc" required placeholder="Bijv. Huur"></div><div class="field"><label>Bedrag (€)</label><input id="recAmount" type="number" min="0.01" step=".01" required inputmode="decimal"></div><div class="field"><label>Categorie</label><select id="recCat">${categories.map(c=>`<option>${c}</option>`).join("")}</select></div><div class="field"><label>Rekening</label><select id="recAcc">${data.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div><div class="field"><label>Dag van de maand</label><input id="recDay" type="number" min="1" max="31" step="1" value="1" required inputmode="numeric"><div class="small">Bijv. 1 voor huur, 5 voor verzekering.</div></div></div>
<div class="form-actions"><button class="btn primary"><i data-lucide="repeat"></i>Toevoegen</button></div></form></div>
<div class="card transactions recurring-list-card"><div class="section-title">Vaste transacties</div>${data.recurring.length?data.recurring.map((r,i)=>`<div class="account recurring-item"><div class="account-left"><div class="account-icon"><i data-lucide="repeat"></i></div><div class="recurring-info"><strong>${esc(r.description)}</strong><div class="small">Elke maand op dag ${Number(r.day||1)} · ${esc(r.category)} · ${esc(accountById(r.accountId)?.name||"-")}</div></div></div><div class="recurring-actions"><span class="${r.kind==="income"?"positive":"negative"}">${r.kind==="income"?"+":"-"}${protectedEuro(r.amount)}</span><button class="icon-btn recurring-edit-btn" data-rec-edit-day="${i}" title="Dag aanpassen" aria-label="Dag aanpassen"><i data-lucide="pencil"></i></button><button class="icon-btn danger" data-rec-delete="${i}" title="Verwijderen" aria-label="Verwijderen"><i data-lucide="trash-2"></i></button></div></div>`).join(""):`<div class="empty">Nog geen terugkerende transacties.</div>`}</div>
${(()=>{
  const deductions=(Array.isArray(data.transactions)?data.transactions:[])
    .filter(t=>t.recurringId && t.kind==="expense")
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<div class="card transactions recurring-deductions-compact"><div class="section-title">Afschrijvingen</div><div class="small" style="margin-bottom:12px">Hier zie je alleen vaste kosten die daadwerkelijk zijn verwerkt, op de vaste dag die je hebt ingesteld.</div>${deductions.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:8px 6px">Datum</th><th style="text-align:left;padding:8px 6px">Omschrijving</th><th style="text-align:left;padding:8px 6px">Rekening</th><th style="text-align:right;padding:8px 6px">Bedrag</th></tr></thead><tbody>${deductions.map(t=>`<tr><td style="padding:9px 6px;border-top:1px solid var(--border)">${new Date(t.date+"T12:00:00").toLocaleDateString("nl-NL")}</td><td style="padding:9px 6px;border-top:1px solid var(--border)">${esc(t.description)}</td><td style="padding:9px 6px;border-top:1px solid var(--border)">${esc(accountById(t.accountId)?.name||"-")}</td><td style="padding:9px 6px;border-top:1px solid var(--border);text-align:right" class="negative">-${protectedEuro(t.amount)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nog geen vaste kosten afgeschreven.</div>`}</div>`;

$("saveWeeklySalary").onclick=()=>{

  if(enabled && (!Number.isFinite(amount)||amount<=0)){notify("Vul een geldig loonbedrag in.");return}
  data.weeklySalary={enabled,amount:amount||0,accountId,description:"Wekelijks loon"};

document.querySelectorAll("[data-rec-edit-day]").forEach(b=>b.onclick=()=>{

function processWeeklySalary(){
  const ws=data.weeklySalary;
  if(!ws || !ws.enabled || !(Number(ws.amount)>0)) return;
  const acc=accountById(ws.accountId)||data.accounts[0];
  if(!acc) return;

  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const now=new Date();
  now.setHours(12,0,0,0);

  // Laatste woensdag tot en met vandaag (op woensdag zelf is dat vandaag).
  const daysSinceWednesday=(now.getDay()+4)%7;
  const lastWednesday=new Date(now);
  lastWednesday.setDate(now.getDate()-daysSinceWednesday);

  // Begin na de laatst verwerkte loonwoensdag, zodat ook gemiste weken worden ingehaald.
  // Is er nog niets verwerkt, dan alleen de laatste woensdag. Maximaal 4 weken terug,
  // zodat een lange pauze niet ineens een stapel loon oplevert.
  const processedDates=Object.keys(data.processedRecurring)
    .filter(k=>k.startsWith("salary_"))
    .map(k=>k.slice(7))
    .sort();
  const start=new Date(lastWednesday);
  if(processedDates.length){
    const [y,m,d]=processedDates[processedDates.length-1].split("-").map(Number);
    start.setFullYear(y,m-1,d+7);
    start.setHours(12,0,0,0);
  }
  const earliest=new Date(lastWednesday);
  earliest.setDate(lastWednesday.getDate()-28);
  if(start<earliest) start.setTime(earliest.getTime());

  const amount=Number(ws.amount);
  let changed=false;
  for(const w=new Date(start); w<=lastWednesday; w.setDate(w.getDate()+7)){
    const dateStr=fmt(w);
    const key=`salary_${dateStr}`;
    if(data.processedRecurring[key]) continue;
    data.transactions.push({
      id:uid(),
      description:ws.description||"Wekelijks loon",
      amount,
      date:dateStr,
      category:"Salaris",
      accountId:acc.id,
      kind:"income"
    });
    acc.balance+=amount;
    data.processedRecurring[key]=true;
    changed=true;
  }
  if(changed) persist();
}

function downloadBackup(){
try{
const backup={app:"Budget Planner",version:2,createdAt:new Date().toISOString(),data:data};
const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=`BudgetPlanner-backup-${new Date().toISOString().slice(0,10)}.json`;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}catch(e){notify("De backup kon niet worden gemaakt.");}
}

function restoreBackup(file){
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const parsed=JSON.parse(reader.result);
const restored=parsed?.data||parsed;
if(!restored||typeof restored!=="object"||!Array.isArray(restored.accounts)||!Array.isArray(restored.transactions))throw new Error();
if(!confirm("Deze backup terugzetten? De huidige gegevens in deze browser worden vervangen."))return;
localStorage.setItem(STORAGE_KEY,JSON.stringify(restored));
data=loadData();
render();
notify("Backup succesvol hersteld.");
}catch(e){notify("Dit bestand is geen geldige Budget Planner-backup.");}
};
reader.onerror=()=>notify("Het backupbestand kon niet worden gelezen.");
reader.readAsText(file);
}

function setupBackupControls(){
$("backupDownload").onclick=downloadBackup;
$("backupRestore").onclick=()=>$("backupFile").click();
$("backupFile").onchange=e=>{restoreBackup(e.target.files?.[0]);e.target.value="";};

const mobileBackup=$("mobileBackup");
const mobileMenu=$("mobileBackupMenu");
if(mobileBackup&&mobileMenu){
  mobileBackup.onclick=()=>{
    mobileMenu.style.display=mobileMenu.style.display==="none"?"block":"none";
  };
  $("mobileBackupDownload").onclick=()=>{
    downloadBackup();
    mobileMenu.style.display="none";
  };
  $("mobileBackupRestore").onclick=()=>{
    $("backupFile").click();
    mobileMenu.style.display="none";
  };
}
}

function init(){
processRecurringTransactions();
processWeeklySalary();
navEvents();
setupGlobalControls();
setupBackupControls();
render();
}
init();
</script>

<script id="app-layer-v2-js">
(function(){
  /* splash */
  var sp=document.createElement("div");sp.id="appSplash";sp.innerHTML='<img src="icons/icon-192.png" alt=""><div class="bar"><i></i></div>';
  document.body.appendChild(sp);
  window.addEventListener("load",function(){setTimeout(function(){sp.style.opacity="0";setTimeout(function(){sp.remove()},400)},350)});
  /* toast i.p.v. browser-alert */
  var tt;window.alert=function(m){var t=document.querySelector(".app-toast");if(!t){t=document.createElement("div");t.className="app-toast";document.body.appendChild(t)}
    t.textContent=String(m);t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2600)};
  /* zoeken, filteren en datumgroepen in Transacties */
  var q="",f="all";
  function apply(sec){var tb=sec.querySelector(".table-wrap tbody");if(!tb)return;
    tb.querySelectorAll("tr.app-day").forEach(function(r){r.remove()});
    var last=null,cols=(tb.querySelector("tr")||{children:[]}).children.length||6;
    Array.prototype.slice.call(tb.querySelectorAll("tr")).forEach(function(r){
      var amt=r.querySelector("td.positive,td.negative");var kind=amt?(amt.classList.contains("positive")?"in":"out"):"move";
      var ok=(f==="all"||f===kind)&&(!q||r.textContent.toLowerCase().indexOf(q)>-1);
      r.style.display=ok?"":"none";
      if(ok){var d=r.querySelector(".transaction-date");var day=d?d.firstChild.textContent.trim():"";
        if(day&&day!==last){var h=document.createElement("tr");h.className="app-day";h.innerHTML='<td colspan="'+cols+'">'+day+'</td>';r.parentNode.insertBefore(h,r);last=day}}
    });}
  function enhance(){var sec=document.getElementById("transactions");if(!sec)return;var tw=sec.querySelector(".table-wrap");
    if(tw&&!sec.querySelector(".app-tx-tools")){var box=document.createElement("div");box.className="app-tx-tools";
      box.innerHTML='<label class="app-search"><i data-lucide="search"></i><input type="search" placeholder="Zoek transacties" value=""></label><div class="app-chips"><button data-f="all">Alles</button><button data-f="in">Inkomsten</button><button data-f="out">Uitgaven</button><button data-f="move">Overboekingen</button></div>';
      tw.parentNode.insertBefore(box,tw);var inp=box.querySelector("input");inp.value=q;
      inp.addEventListener("input",function(){q=inp.value.trim().toLowerCase();apply(sec)});
      box.querySelectorAll("[data-f]").forEach(function(b){b.classList.toggle("on",b.dataset.f===f);b.addEventListener("click",function(){f=b.dataset.f;box.querySelectorAll("[data-f]").forEach(function(x){x.classList.toggle("on",x===b)});apply(sec)})});

  var mo=new MutationObserver(function(){mo.disconnect();enhance();obs()});
  function obs(){var s=document.getElementById("transactions");s&&mo.observe(s,{childList:true})}
  function start(){enhance();obs()}

  var h=location.hostname;

})();
